name: Developer Task / Feature Implementation
description: Plan and document a technical change before creating a branch.
labels: ["internal", "development"]
body:
  - type: markdown
    attributes:
      value: |
        **Internal Use Only.** Use this to scope out your technical implementation to avoid overlapping with other devs.
  - type: input
    id: scope
    attributes:
      label: Feature/Task Title
      placeholder: "e.g., GET /api/papers/{paperId}/my-request Implementation"
    validations:
      required: true
  - type: textarea
    id: implementation-plan
    attributes:
      label: Implementation Plan
      description: Describe the technical steps (Endpoints, Services, Logic).
      placeholder: |
        1. Create DTO for MyRequestResponse
        2. Implement service logic to check current user's request status for specific paperId.
        3. Map DB status (PENDING/ACCEPTED) to UI-ready strings.
    validations:
      required: true
  - type: checkboxes
    id: affected-layers
    attributes:
      label: Affected Layers
      options:
        - label: API Layer (Controllers/Endpoints)
        - label: Service Layer (Business Logic)
        - label: Data Layer (Repository/Migration)
        - label: Frontend (React/Typescript)
  - type: textarea
    id: api-changes
    attributes:
      label: API & Data Changes
      description: Document any changes to the API Contract or DB Schema here.
      placeholder: |
        New Endpoint: GET /api/papers/{id}/my-request
        Response: { "status": "PENDING", "requestId": 123 }
  - type: input
    id: branch-name
    attributes:
      label: Proposed Branch Name
      placeholder: "feat/issue-number-description"
