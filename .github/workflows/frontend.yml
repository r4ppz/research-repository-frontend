name: Frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Quality Checks
        run: npm run check

      # Build React SPA
      - name: Build SPA
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: 594492409648-tqrnnk9ssgvphc8cnus7k1fmp4o4emru.apps.googleusercontent.com
          VITE_BACKEND_API_BASE_URL: https://r4ppz.uaru-firefighter.ts.net/

      - name: Build Storybook
        run: npm run build-storybook

      - name: Deploy SPA to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          keep_files: true # Prevents overwriting Storybook

      # Deploy Storybook to /storybook/
      - name: Deploy Storybook
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git clone --branch gh-pages https://github.com/${{ github.repository }} gh-pages-temp
          rm -rf gh-pages-temp/storybook
          mv storybook-static gh-pages-temp/storybook
          cd gh-pages-temp
          git add .
          git commit -m "Update Storybook"
          git push origin gh-pages
